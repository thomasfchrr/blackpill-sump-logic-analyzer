name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test (hardware tests are skipped without a device)
        working-directory: host
        run: |
          pip install -e ".[test]"
          pytest -q

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (Clang + LLD, newlib-nano from the Arm GNU bundle)
        run: |
          # The default Azure mirror can hang; fail fast and retry on the main archive instead.
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          echo "http://archive.ubuntu.com/ubuntu/ priority:1" | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get $APT update
          sudo apt-get $APT install -y --no-install-recommends clang lld cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi binutils-arm-none-eabi
      - name: Build
        run: |
          cmake -S firmware -B firmware/build -G Ninja
          cmake --build firmware/build
      - name: Size report
        run: arm-none-eabi-size firmware/build/blackpill_sump.elf
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            firmware/build/blackpill_sump.elf
            firmware/build/blackpill_sump.bin
